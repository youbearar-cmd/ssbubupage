<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 연동 설정</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #F1F5F9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    h1 { font-size: 1.2rem; font-weight: 700; color: #2B6A4F; margin-bottom: 6px; }
    p  { font-size: 0.85rem; color: #6B7280; margin-bottom: 24px; line-height: 1.6; }
    label { display: block; font-size: 0.78rem; font-weight: 700; color: #6B7280; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #E8E4DC;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #2B6A4F; }
    button {
      width: 100%;
      padding: 14px;
      background: #2B6A4F;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #3D8B68; }
    .success {
      background: #EDF7F2;
      border: 1px solid #6EE7B7;
      border-radius: 8px;
      padding: 14px;
      color: #065F46;
      font-size: 0.875rem;
      margin-top: 16px;
      display: none;
      text-align: center;
    }
    .error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 14px;
      color: #991B1B;
      font-size: 0.875rem;
      margin-top: 16px;
      display: none;
    }
    .hint { font-size: 0.75rem; color: #6B7280; margin-top: -8px; margin-bottom: 14px; }
    .hint a { color: #2B6A4F; font-weight: 700; }
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .connected    { background: #EDF7F2; color: #2B6A4F; }
    .disconnected { background: #FEF3C7; color: #92400E; }
  </style>
</head>
<body>
<div class="card">
  <h1>🔗 GitHub 자동 배포 설정</h1>
  <p>한 번만 설정하면 관리자 페이지에서 저장 시 자동으로 사이트가 업데이트됩니다.</p>

  <div id="current-status"></div>

  <div>
    <label>GitHub 사용자명</label>
    <input type="text" id="owner" value="youbearar-cmd">

    <label>저장소 이름</label>
    <input type="text" id="repo" value="ssbubupage">

    <label>Personal Access Token</label>
    <input type="password" id="token" placeholder="ghp_로 시작하는 토큰 붙여넣기">
    <p class="hint">
      토큰 없으면 →
      <a href="https://github.com/settings/tokens/new?scopes=repo&description=hanui" target="_blank">여기서 발급</a>
      (repo 체크 필수)
    </p>

    <button onclick="save()">저장하기</button>
  </div>

  <div class="success" id="success">
    ✅ 연동 완료!<br>
    <a href="admin.html" style="color:#2B6A4F; font-weight:700; display:block; margin-top:8px;">
      → 관리자 페이지로 이동
    </a>
  </div>
  <div class="error" id="error"></div>
</div>

<script>
  // 현재 연동 상태 표시
  var saved = localStorage.getItem('gh_token');
  var statusEl = document.getElementById('current-status');
  if (saved) {
    var owner = localStorage.getItem('gh_owner') || '';
    statusEl.innerHTML = '<span class="status-badge connected">✅ 현재 연동됨: ' + owner + '</span>';
  } else {
    statusEl.innerHTML = '<span class="status-badge disconnected">⚠ 미연동 상태</span>';
  }

  function save() {
    var token = document.getElementById('token').value.trim();
    var owner = document.getElementById('owner').value.trim();
    var repo  = document.getElementById('repo').value.trim();
    var errEl = document.getElementById('error');
    var okEl  = document.getElementById('success');
    errEl.style.display = 'none';
    okEl.style.display  = 'none';

    if (!token) { errEl.textContent = '토큰을 입력해 주세요.'; errEl.style.display = 'block'; return; }

    // 토큰 유효성 확인
    fetch('https://api.github.com/repos/' + owner + '/' + encodeURIComponent(repo), {
      headers: { Authorization: 'token ' + token }
    })
    .then(function(r) {
      if (r.ok) {
        localStorage.setItem('gh_token', token);
        localStorage.setItem('gh_owner', owner);
        localStorage.setItem('gh_repo',  repo);
        okEl.style.display = 'block';
        statusEl.innerHTML = '<span class="status-badge connected">✅ 연동됨: ' + owner + '</span>';
      } else if (r.status === 401) {
        errEl.textContent = '토큰이 올바르지 않습니다. 다시 확인해 주세요.';
        errEl.style.display = 'block';
      } else if (r.status === 404) {
        errEl.textContent = '저장소를 찾을 수 없습니다. 이름을 확인해 주세요.';
        errEl.style.display = 'block';
      } else {
        errEl.textContent = '오류가 발생했습니다 (HTTP ' + r.status + ')';
        errEl.style.display = 'block';
      }
    })
    .catch(function() {
      errEl.textContent = '네트워크 오류. 인터넷 연결을 확인해 주세요.';
      errEl.style.display = 'block';
    });
  }
</script>
</body>
</html>
