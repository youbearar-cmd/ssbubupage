<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재진 신청 | 성산부부한의원 비대면 처방</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js?v=20260604175549"></script>
  <style>
    .form-wrap { background: #fff; max-width: 700px; margin: 0 auto; padding: 0 0 40px; }
    .form-info-bar {
      background: #FFF8EC;
      border-bottom: 1px solid #F6D99A;
      padding: 12px 20px;
      font-size: 0.85rem;
      color: #7A5200;
      display: flex; align-items: center; gap: 8px;
    }
    .google-form-iframe { width: 100%; min-height: 100vh; border: none; display: block; }
    .iframe-loader {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 20px; gap: 16px;
      color: var(--muted); font-size: 0.9rem;
    }
    .loader-ring {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo" id="clinic-name-header">한의원</a>
    <nav>
      <a href="index.html">홈</a>
      <a href="medicines.html">비급여 목록</a>
      <a href="order.html" class="active">구매 신청</a>
    </nav>
  </div>
</header>

<div style="background:var(--gold); color:#fff; padding:20px 16px 24px;">
  <div class="container">
    <a href="order.html" style="font-size:0.82rem; opacity:0.85; display:inline-flex; align-items:center; gap:4px; margin-bottom:10px;">
      ← 뒤로
    </a>
    <h1 style="font-size:1.3rem; font-weight:700; display:flex; align-items:center; gap:8px;">
      🌿 재진 신청서
    </h1>
    <p style="opacity:0.9; font-size:0.85rem; margin-top:4px;">
      기존에 내원하신 경험이 있는 현재 환자분
    </p>
  </div>
</div>

<div class="form-wrap">
  <div class="form-info-bar">
    ✅ 작성하신 내용은 한의원으로 즉시 전달됩니다.
  </div>

  <div class="iframe-loader" id="form-loader">
    <div class="loader-ring"></div>
    <span>신청서를 불러오는 중...</span>
  </div>

  <iframe
    id="google-form"
    class="google-form-iframe"
    src="https://docs.google.com/forms/d/e/1FAIpQLScA7A6JgpweIRD2SUmaGNpp6Om0T3KuMbh4Jk7fALBL04o-8Q/viewform?embedded=true"
    style="display:none;"
    onload="formLoaded()"
    allow="camera; microphone">
  </iframe>
</div>

<footer class="site-footer">
  <div class="container">
    <strong id="footer-name"></strong><br>
    <span id="footer-address"></span><br>
    <a id="footer-phone-link" href="#" style="color:#9CA3AF;"></a>
  </div>
</footer>

<script>
  document.getElementById('clinic-name-header').textContent = CLINIC_INFO.name;
  document.getElementById('footer-name').textContent        = CLINIC_INFO.name;
  document.getElementById('footer-address').textContent     = CLINIC_INFO.address;
  var phoneLink = document.getElementById('footer-phone-link');
  phoneLink.textContent = CLINIC_INFO.phone;
  phoneLink.href = 'tel:' + CLINIC_INFO.phone.replace(/-/g, '');

  function formLoaded() {
    document.getElementById('form-loader').style.display = 'none';
    document.getElementById('google-form').style.display = 'block';
  }

  setTimeout(function() {
    var loader = document.getElementById('form-loader');
    if (loader.style.display !== 'none') {
      loader.innerHTML =
        '<p style="color:var(--muted); font-size:0.875rem; text-align:center; padding:0 20px;">' +
        '폼을 불러오는 데 시간이 걸립니다.<br>' +
        '<a href="' + CLINIC_INFO.formRevisit + '" target="_blank" ' +
        'style="color:var(--gold); font-weight:700; text-decoration:underline;">' +
        '→ 새 탭에서 신청서 열기</a></p>';
    }
  }, 5000);
</script>

</body>
</html>
